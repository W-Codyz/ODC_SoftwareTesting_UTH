$kind: http-request
url: "{{base_url}}/api/lab-admin/enterprises"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "companyName": "Postman Test Enterprise",
      "taxCode": "{{$timestamp}}",
      "businessLicenseNumber": "PM-BL-{{$timestamp}}",
      "address": "1 Test Street",
      "city": "Ho Chi Minh City",
      "district": "District 1",
      "ward": "Ben Nghe",
      "representativeName": "Postman Tester",
      "representativePosition": "QA",
      "contactEmail": "postman{{$timestamp}}@example.com",
      "contactPhone": "0900000000",
      "website": "https://example.com",
      "industry": "Software",
      "companySize": "50-100",
      "yearEstablished": 2020,
      "description": "Created from Postman test"
    }
scripts:
  - type: beforeRequest
    code: |-
      var base_url = pm.environment.get('base_url') || pm.environment.get('base_url');
      pm.sendRequest({
          url: base_url + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
              mode: 'raw',
              raw: JSON.stringify({ email: 'labadmin2@labodc.com', password: '123123' })
          }
      }, function(err, res) {
          if (!err && res.code === 200) {
              var jsonData = res.json();
              var token = jsonData.token || (jsonData.data && jsonData.data.token);
              if (token) { pm.environment.set('token', token); }
          }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response success is true', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
      });

      pm.test('Response data exists', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data).to.not.be.null;
      });

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 4000
