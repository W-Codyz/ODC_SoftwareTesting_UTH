$kind: http-request
description: Requires scripts/postman_mentor_projects_fixtures.sql; it creates a temporary Mentor profile with no projects.
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "qa-postman-mp-empty@labodc.com",
      "password": "123123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login returns 200', () => pm.response.to.have.status(200));
      pm.environment.set('token_mentor_empty', pm.response.json().data.token);
    language: text/javascript
order: 6000
