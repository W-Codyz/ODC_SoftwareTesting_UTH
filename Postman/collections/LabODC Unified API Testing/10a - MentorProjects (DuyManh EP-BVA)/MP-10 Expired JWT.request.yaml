$kind: http-request
description: "TC-MP-10: set mp_expired_token to a valid HS384 JWT for Mentor 1 that is already expired. Expected 401; current API returns 500."
url: "{{base_url}}/api/mentor/projects"
method: GET
headers:
  Authorization: Bearer {{mp_expired_token}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Expected 401 for expired JWT',()=>pm.response.to.have.status(401));
    language: text/javascript
order: 13000
