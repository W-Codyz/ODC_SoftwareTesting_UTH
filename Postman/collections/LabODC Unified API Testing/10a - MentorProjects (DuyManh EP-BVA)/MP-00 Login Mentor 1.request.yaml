$kind: http-request
description: Run first in this folder; stores Mentor 1 token for MP-02/04/05.
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "mentor.nguyenquang@uth.edu.vn",
      "password": "123123"
    }
scripts:
  - type: afterResponse
    code: pm.test('Login returns 200',()=>pm.response.to.have.status(200));pm.environment.set('token',pm.response.json().data.token);
