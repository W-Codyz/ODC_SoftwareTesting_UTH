$kind: http-request
description: Stores a valid ENTERPRISE token for MP-13.
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "contact@techcorp.vn",
      "password": "123123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login returns 200', () => pm.response.to.have.status(200));
      pm.environment.set('token_enterprise', pm.response.json().data.token);
    language: text/javascript
order: 17000
