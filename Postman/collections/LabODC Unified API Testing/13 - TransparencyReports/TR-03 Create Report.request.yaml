$kind: http-request
url: "{{base_url}}/api/lab-admin/transparency-reports"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reportType": "QUARTERLY",
      "period": "{{report_period}}",
      "autoGenerate": true
    }
scripts:
  - type: beforeRequest
    code: |-
      var base_url = pm.environment.get('base_url') || pm.environment.get('base_url');
      pm.sendRequest({
          url: base_url + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
              mode: 'raw',
              raw: JSON.stringify({ email: 'labadmin2@labodc.com', password: '123123' })
          }
      }, function(err, res) {
          if (!err && res.code === 200) {
              var jsonData = res.json();
              var token = jsonData.token || (jsonData.data && jsonData.data.token);
              if (token) { pm.environment.set('token', token); }
          }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 or 201', function () { pm.expect([200, 201]).to.include(pm.response.code); });
      pm.test('Response success is true', function () { pm.expect(pm.response.json().success).to.eql(true); });
      pm.test('Report created with ID', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data).to.not.be.null;
          if (jsonData.data && jsonData.data.reportId) {
              pm.environment.set('report_id', jsonData.data.reportId);
          }
      });
      pm.test('Response time is under 2000ms', function () { pm.expect(pm.response.responseTime).to.be.below(2000); });
    language: text/javascript
order: 3000
