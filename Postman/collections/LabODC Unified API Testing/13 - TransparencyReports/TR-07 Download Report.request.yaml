$kind: http-request
url: "{{base_url}}/api/lab-admin/transparency-reports/{{report_id}}/download"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      var base_url = pm.environment.get('base_url') || pm.environment.get('base_url');
      pm.sendRequest({
          url: base_url + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
              mode: 'raw',
              raw: JSON.stringify({ email: 'labadmin2@labodc.com', password: '123123' })
          }
      }, function(err, res) {
          if (!err && res.code === 200) {
              var jsonData = res.json();
              var token = jsonData.token || (jsonData.data && jsonData.data.token);
              if (token) { pm.environment.set('token', token); }
          }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response has content (binary file)', function () {
          var contentLength = pm.response.headers.get('Content-Length');
          var hasContent = pm.response.responseSize > 0 || (contentLength && parseInt(contentLength) > 0) || pm.response.body.length > 0;
          pm.expect(hasContent).to.be.true;
      });

      pm.test('Response time is under 5000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
order: 7000
