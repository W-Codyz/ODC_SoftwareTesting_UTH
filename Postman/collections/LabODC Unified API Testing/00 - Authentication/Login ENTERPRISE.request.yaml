$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "enterprise1@example.com",
      "password": "123123"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();

      pm.test('Login successful', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Token received and saved', function () {
          var token = jsonData.token || (jsonData.data && jsonData.data.token);
          pm.expect(token).to.not.be.empty;
          pm.environment.set('enterprise_token', token);
          pm.environment.set('token', token);
      });

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 3000
