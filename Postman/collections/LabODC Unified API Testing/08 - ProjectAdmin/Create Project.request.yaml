$kind: http-request
url: "{{base_url}}/api/lab-admin/projects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "projectName": "Test Project {{test_suffix}}",
      "description": "Created by Postman automated test",
      "enterpriseId": "{{enterprise_id}}",
      "startDate": "{{project_start_date}}",
      "endDate": "{{project_end_date}}",
      "budget": 50000000,
      "maxTeamSize": 5,
      "requiredSkills": [
        "Java",
        "Spring Boot",
        "Testing"
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      var base_url = pm.environment.get('base_url') || pm.environment.get('base_url');
      pm.sendRequest({
          url: base_url + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: { mode: 'raw', raw: JSON.stringify({ email: 'labadmin2@labodc.com', password: '123123' }) }
      }, function(err, res) {
          if (!err && res.code === 200) {
              var jsonData = res.json();
              var token = jsonData.token || (jsonData.data && jsonData.data.token);
              if (token) { pm.environment.set('token', token); }
          }
      });

      // Generate dynamic dates
      var now = new Date();
      var start = new Date(now.getTime() + 7*24*60*60*1000);
      var end = new Date(now.getTime() + 90*24*60*60*1000);
      pm.environment.set('project_start_date', start.toISOString().split('T')[0]);
      pm.environment.set('project_end_date', end.toISOString().split('T')[0]);
    language: text/javascript
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      pm.test('Project created', function () {
          pm.expect([200, 201]).to.include(pm.response.code);
      });
      pm.test('Project ID saved', function () {
          if (jsonData.data && jsonData.data.projectId) {
              pm.environment.set('project_id', jsonData.data.projectId);
          }
          pm.expect(jsonData.data).to.not.be.null;
      });
      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 1000
