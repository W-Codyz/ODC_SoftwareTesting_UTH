$kind: http-request
url: '{{base_url}}/api/lab-admin/talents/{{talent_id}}'
method: GET
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Ensure talent_id is set to a valid value
      var talentId = pm.environment.get("talent_id");
      if (!talentId || talentId > 10) {
          pm.environment.set("talent_id", "1");
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      var jsonData = pm.response.json();

      pm.test('Response has id field (flat response)', function () {
          pm.expect(jsonData).to.have.property('id');
      });

      pm.test('Talent data exists', function () {
          pm.expect(jsonData).to.not.be.null;
      });

      pm.test('Talent has fullName', function () {
          pm.expect(jsonData.fullName).to.not.be.null;
      });

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
settings: {}
order: 2000
