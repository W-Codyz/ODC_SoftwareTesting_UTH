$kind: http-request
name: 'TL-14 Submit Task'
method: POST
url: '{{base_url}}/api/talent/tasks/{{task_id}}/submit'
order: 14000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "submissionNote": "Task completed as required. All acceptance criteria met.",
      "submissionUrl": "https://github.com/nguyenvana/task-submission"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Auto-login as Talent user to get correct role token
      var base_url = pm.environment.get("base_url");
      pm.sendRequest({
          url: base_url + "/api/auth/login",
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: {
              mode: "raw",
              raw: JSON.stringify({
                  email: "nguyenvana@student.uth.edu.vn",
                  password: "123123"
              })
          }
      }, function(err, res) {
          if (!err && res.code === 200) {
              var jsonData = res.json();
              var token = jsonData.token || (jsonData.data && jsonData.data.token);
              if (token) {
                  pm.environment.set("token", token);
              }
          }
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      // Note: This endpoint requires a file upload - cannot be fully automated
      pm.test("Submit Task endpoint exists (BLOCKED - requires file)", function () {
          pm.expect([200, 201, 400, 500]).to.include(pm.response.code);
      });
      pm.test("Response time is under 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
