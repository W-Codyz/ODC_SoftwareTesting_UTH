$kind: http-request
url: "{{base_url}}/api/talent/projects/2"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      // Auto-login as Talent user to get correct role token
      var base_url = pm.environment.get("base_url");
      pm.sendRequest({
          url: base_url + "/api/auth/login",
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: {
              mode: "raw",
              raw: JSON.stringify({
                  email: "nguyenvana@student.uth.edu.vn",
                  password: "123123"
              })
          }
      }, function(err, res) {
          if (!err && res.code === 200) {
              var jsonData = res.json();
              var token = jsonData.token || (jsonData.data && jsonData.data.token);
              if (token) {
                  pm.environment.set("token", token);
              }
          }
      });
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response success is true\", function () {\r

      \    const res = pm.response.json();\r

      \    pm.expect(res.success).to.eql(true);\r

      });\r

      \r

      pm.test(\"Project data exists\", function () {\r

      \    const res = pm.response.json();\r

      \    pm.expect(res.data).to.not.be.null;\r

      });\r

      \r

      pm.test(\"Project ID is 2\", function () {\r

      \    const res = pm.response.json();\r

      \    pm.expect(res.data.id).to.eql(2);\r

      });"
    language: text/javascript
order: 4000
