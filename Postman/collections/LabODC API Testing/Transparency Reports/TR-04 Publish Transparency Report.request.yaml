$kind: http-request
method: POST
url: '{{base_url}}/api/lab-admin/transparency-reports/{{report_id}}/publish'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "publishNote": "Published via automated test"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Ensure report_id is set; use report 1 as fallback
      var reportId = pm.environment.get("report_id");
      if (!reportId) {
          pm.environment.set("report_id", "1");
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
      });
      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
