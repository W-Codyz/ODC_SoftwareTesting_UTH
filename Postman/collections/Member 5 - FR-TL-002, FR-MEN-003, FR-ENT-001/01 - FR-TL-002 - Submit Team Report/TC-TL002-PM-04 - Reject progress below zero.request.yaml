$kind: http-request
url: "{{base_url}}/api/talent-leader/projects/{{project_id}}/reports"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reportType": "MONTHLY",
      "reportingPeriod": "{{reporting_period}}",
      "overallProgress": -1,
      "tasksCompleted": []
    }
auth:
  type: bearer
  credentials:
    token: "{{talent_token}}"
scripts:
  - type: afterResponse
    code: pm.test("Invalid progress is rejected (expected HTTP 400)", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
