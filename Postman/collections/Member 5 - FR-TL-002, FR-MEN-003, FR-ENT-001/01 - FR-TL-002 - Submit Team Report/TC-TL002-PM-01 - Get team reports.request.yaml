$kind: http-request
url: "{{base_url}}/api/talent-leader/projects/{{project_id}}/reports"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{talent_token}}"
scripts:
  - type: afterResponse
    code: pm.test("SRS route is available (expected HTTP 200)", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
