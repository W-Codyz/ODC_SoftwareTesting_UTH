$kind: http-request
url: "{{base_url}}/api/enterprise/profile"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{enterprise_token}}"
scripts:
  - type: afterResponse
    code: pm.test("SRS profile route is available (expected HTTP 200)", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
