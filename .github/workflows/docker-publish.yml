name: Build and Push Docker Images

on:
  push:
    tags:
      - 'week-*-v*'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./labodc-backend
          push: true
          tags: |
            dinhphatz/odc-testing:backend-${{ github.ref_name }}
            dinhphatz/odc-testing:backend-latest

  build-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./labodc/api-gateway
          push: true
          tags: |
            dinhphatz/odc-testing:api-gateway-${{ github.ref_name }}
            dinhphatz/odc-testing:api-gateway-latest

  build-auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./labodc/auth-service
          push: true
          tags: |
            dinhphatz/odc-testing:auth-service-${{ github.ref_name }}
            dinhphatz/odc-testing:auth-service-latest

  build-user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./labodc/user-service
          push: true
          tags: |
            dinhphatz/odc-testing:user-service-${{ github.ref_name }}
            dinhphatz/odc-testing:user-service-latest

  build-project-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./labodc/project-service
          push: true
          tags: |
            dinhphatz/odc-testing:project-service-${{ github.ref_name }}
            dinhphatz/odc-testing:project-service-latest