$kind: http-request
url: "{{base_url}}/api/lab-admin/talents/{{talent_id}}"
method: PUT
body:
  type: json
  content: "{\r

    \  \"fullName\": \"Tran Updated Talent\",\r

    \  \"studentId\": \"TEST001\",\r

    \  \"university\": \"UTH\",\r

    \  \"major\": \"Software Engineering\",\r

    \  \"yearOfStudy\": 4,\r

    \  \"bio\": \"Updated bio\"\r

    }"
scripts:
  - type: beforeRequest
    code: "// Dán vào tab Scripts > Pre-request\r

      const loginRequest = {\r

      \    url: pm.environment.get(\"base_url\") + \"/api/auth/login\",\r

      \    method: \"POST\",\r

      \    header: { \"Content-Type\": \"application/json\" },\r

      \    body: {\r

      \        mode: \"raw\",\r

      \        raw: JSON.stringify({\r

      \            email: \"admin@labodc.com\",\r

      \            password: \"123123\"\r

      \        })\r

      \    }\r

      };\r

      \r

      pm.sendRequest(loginRequest, function (err, res) {\r

      \    var data = res.json();\r

      \    if (data.data && data.data.token) {\r

      \        pm.environment.set(\"token\", data.data.token);\r

      \    }\r

      });"
    language: text/javascript
order: 4000
