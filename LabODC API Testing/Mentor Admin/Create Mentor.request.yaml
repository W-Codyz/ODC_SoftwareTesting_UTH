$kind: http-request
url: "{{base_url}}/api/lab-admin/mentors"
method: POST
body:
  type: json
  content: |-
    {
      "userId": 32,
      "fullName": "Test API Mentor",
      "title": "Mr.",
      "currentPosition": "Senior Developer",
      "currentCompany": "Tech Corp",
      "yearsOfExperience": 5,
      "bio": "Experienced developer",
      "expertise": ["Java", "Spring Boot"],
      "hourlyRate": 50.0,
      "currency": "USD",
      "maxConcurrentProjects": 3,
      "available": true
    }
scripts:
  - type: afterResponse
    code: "var res = pm.response.json();\r

      var id = res.id || (res.data && res.data.id);\r

      if (id) {\r

      \    pm.environment.set(\"mentor_id\", id);\r

      }\r

      pm.test(\"Mentor created\", function () {\r

      \    pm.response.to.have.status(200);\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "const loginRequest = {\r

      \    url: pm.environment.get(\"base_url\") + \"/api/auth/login\",\r

      \    method: \"POST\",\r

      \    header: { \"Content-Type\": \"application/json\" },\r

      \    body: {\r

      \        mode: \"raw\",\r

      \        raw: JSON.stringify({\r

      \            email: \"admin@labodc.com\",\r

      \            password: \"123123\"\r

      \        })\r

      \    }\r

      };\r

      \r

      pm.sendRequest(loginRequest, function (err, res) {\r

      \    var data = res.json();\r

      \    if (data.data && data.data.token) {\r

      \        pm.environment.set(\"token\", data.data.token);\r

      \    }\r

      });"
    language: text/javascript
order: 5000
